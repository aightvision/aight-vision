<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>SWILL / back</title>
<style>
  :root { --aight-yellow: #C8A63C; --aight-yellow-hover: #d8b345; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body {
    min-height: 100%;
    background: #0a0a0a;
    color: #ddd;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px;
  }
  button { font-family: inherit; }

  /* ── {BUTTON} convention ─────────────────────────────────────── */
  .aight-btn {
    background: #000;
    color: var(--aight-yellow);
    border: 1px solid var(--aight-yellow);
    padding: 6px 10px;
    border-radius: 3px;
    font-size: 11px;
    letter-spacing: 0.12em;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    white-space: nowrap;
    line-height: 1.15;
    user-select: none;
    transition: background 0.15s, color 0.15s;
  }
  .aight-btn::before { content: "{"; opacity: 0.9; padding-right: 3px; }
  .aight-btn::after  { content: "}"; opacity: 0.9; padding-left: 3px; }
  .aight-btn:hover { background: rgba(200,166,60,0.15); }
  .aight-btn.important, .aight-btn.active { background: var(--aight-yellow); color: #000; font-weight: 700; }
  .aight-btn.important:hover, .aight-btn.active:hover { background: var(--aight-yellow-hover); }
  .aight-btn:disabled { opacity: 0.35; cursor: default; }
  .aight-btn.small { padding: 4px 7px; font-size: 10px; }

  input, select, textarea {
    font-family: inherit;
    font-size: 13px;
    color: #eee;
    background: #141414;
    border: 1px solid #2a2a2a;
    border-radius: 4px;
    padding: 7px 9px;
    width: 100%;
    outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: rgba(200,166,60,0.7); }
  textarea { resize: vertical; line-height: 1.45; }

  /* ── Gate ────────────────────────────────────────────────────── */
  #gate {
    position: fixed; inset: 0; z-index: 90; background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    padding: 20px;
  }
  #gate.hidden { display: none; }
  #gate-title { font-size: 11px; letter-spacing: 0.3em; color: rgba(255,255,255,0.4); }
  #gate-row { display: flex; gap: 10px; width: 100%; max-width: 340px; }
  #gate-err { color: #e57373; font-size: 11px; letter-spacing: 0.15em; min-height: 14px; }

  /* ── Layout ──────────────────────────────────────────────────── */
  #app { display: none; padding: 24px 24px 80px; max-width: 1280px; margin: 0 auto; }
  #app.visible { display: block; }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }
  .brand { font-size: 11px; letter-spacing: 0.3em; color: rgba(255,255,255,0.4); margin-right: auto; }
  .brand b { color: var(--aight-yellow); font-weight: 400; }
  #status { font-size: 11px; color: rgba(255,255,255,0.35); letter-spacing: 0.06em; }

  #drop-zone {
    border: 1.5px dashed #2a2a2a; border-radius: 10px;
    padding: 30px 24px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    transition: border-color 0.2s, background 0.2s;
    margin-bottom: 14px;
  }
  #drop-zone.drag-over { border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.03); }
  #drop-zone p { color: rgba(255,255,255,0.22); letter-spacing: 0.1em; font-size: 11px; text-transform: uppercase; }
  #drop-zone .aight-btn { font-size: 13px; padding: 9px 18px; }
  input[type=file] { display: none; }

  #queue { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
  .q-item { background: #141414; border: 1px solid #222; border-radius: 6px; padding: 8px 12px; display: flex; flex-direction: column; gap: 5px; }
  .q-top { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; }
  .q-name { color: #aaa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .q-st { color: #777; white-space: nowrap; font-size: 11px; }
  .q-st.done { color: #4caf50; } .q-st.error { color: #e57373; }
  .q-bar-wrap { height: 2px; background: #222; border-radius: 2px; overflow: hidden; }
  .q-bar { height: 100%; width: 0; background: rgba(255,255,255,0.5); transition: width 0.2s; }

  .grid-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .grid-title { font-size: 11px; letter-spacing: 0.3em; color: rgba(255,255,255,0.35); }
  #grid-filter { font-size: 11px; color: var(--aight-yellow); letter-spacing: 0.06em; }
  #grid-count { font-size: 11px; color: rgba(255,255,255,0.2); }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .tile { position: relative; background: #141414; border: 1px solid #222; border-radius: 7px; overflow: hidden; cursor: pointer; transition: border-color 0.15s; }
  .tile:hover { border-color: #3a3a3a; }
  .tile .thumb { aspect-ratio: 1; background: #0d0d0d; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .tile .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .ext { font-size: 12px; letter-spacing: 0.2em; color: rgba(255,255,255,0.3); text-transform: uppercase; }
  .tile .meta { padding: 7px 9px 8px; display: flex; flex-direction: column; gap: 2px; }
  .tile .t1 { font-size: 12px; color: #ccc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .t2 { font-size: 10px; letter-spacing: 0.06em; color: rgba(255,255,255,0.3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .dot { position: absolute; top: 7px; right: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--aight-yellow); box-shadow: 0 0 0 2px #000; }
  .tile .badge { position: absolute; top: 6px; left: 6px; font-size: 9px; letter-spacing: 0.12em; padding: 2px 5px; border-radius: 3px; background: rgba(0,0,0,0.75); color: rgba(255,255,255,0.6); text-transform: uppercase; }
  .empty { color: rgba(255,255,255,0.25); font-size: 12px; letter-spacing: 0.08em; padding: 30px 0; }
  #import-row { display: none; margin-bottom: 18px; gap: 10px; align-items: center; color: rgba(255,255,255,0.4); font-size: 12px; }
  #import-row.show { display: flex; }

  /* ── Sort sidebar ────────────────────────────────────────────── */
  #side {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(0,0,0,0.55);
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  #side.open { opacity: 1; pointer-events: auto; }
  .side-inner {
    position: absolute; top: 0; left: 0; bottom: 0; width: min(320px, 84vw);
    background: rgba(12,12,12,0.97); border-right: 1px solid rgba(255,255,255,0.08);
    padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 10px;
    transform: translateX(-100%); transition: transform 0.25s ease;
  }
  #side.open .side-inner { transform: none; }
  .side-head { display: flex; align-items: center; justify-content: space-between; }
  .side-title { font-size: 11px; letter-spacing: 0.32em; color: rgba(255,255,255,0.4); }
  #side-list { flex: 1; overflow-y: auto; }
  .s-row { display: flex; justify-content: space-between; padding: 9px 4px; cursor: pointer; color: rgba(255,255,255,0.72); font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.04); user-select: none; }
  .s-row:hover { color: #fff; }
  .s-row.sub { padding-left: 20px; font-size: 13px; color: rgba(255,255,255,0.55); }
  .s-row.sel { color: var(--aight-yellow); }
  .s-row .n { color: rgba(255,255,255,0.25); font-size: 11px; }
  .s-row.muted { color: rgba(255,255,255,0.4); font-style: italic; }
  .side-add { display: flex; gap: 8px; }

  /* ── Work modal ──────────────────────────────────────────────── */
  #modal {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.88);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  #modal.open { display: flex; }
  .m-inner {
    background: #0d0d0d; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
    width: 100%; max-width: 1100px; height: calc(100vh - 40px);
    display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, 1fr);
    overflow: hidden;
  }
  .m-left { display: flex; flex-direction: column; background: #000; min-height: 0; }
  #m-preview { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 14px; }
  #m-preview img, #m-preview video { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  #m-preview audio { width: 90%; }
  .doc-card { display: flex; flex-direction: column; align-items: center; gap: 14px; color: rgba(255,255,255,0.5); text-align: center; padding: 20px; }
  .doc-card .ext { font-size: 22px; letter-spacing: 0.3em; color: rgba(255,255,255,0.35); }
  #m-files { display: flex; gap: 6px; padding: 8px 10px; overflow-x: auto; border-top: 1px solid #1a1a1a; align-items: center; }
  .m-file { position: relative; width: 56px; height: 56px; flex: 0 0 56px; border: 1px solid #2a2a2a; border-radius: 4px; overflow: hidden; cursor: pointer; background: #111; display: flex; align-items: center; justify-content: center; font-size: 9px; letter-spacing: 0.1em; color: rgba(255,255,255,0.4); text-transform: uppercase; }
  .m-file img { width: 100%; height: 100%; object-fit: cover; }
  .m-file.cur { border-color: var(--aight-yellow); }
  .m-file .x { position: absolute; top: 1px; right: 1px; width: 16px; height: 16px; line-height: 14px; text-align: center; background: rgba(0,0,0,0.8); color: #ddd; font-size: 11px; border-radius: 2px; display: none; }
  .m-file:hover .x { display: block; }
  #m-files .aight-btn { flex: 0 0 auto; }

  .m-right { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid #1a1a1a; }
  .m-top { display: flex; align-items: center; gap: 6px; padding: 12px 12px 10px; border-bottom: 1px solid #1a1a1a; flex-wrap: wrap; }
  .m-top .spacer { flex: 1; }
  #m-publish { font-size: 12px; padding: 7px 14px; }
  .m-tools { display: flex; gap: 6px; padding: 10px 12px; border-bottom: 1px solid #1a1a1a; flex-wrap: wrap; }
  .m-body { flex: 1; overflow-y: auto; padding: 14px 14px 30px; display: flex; flex-direction: column; gap: 16px; }
  .m-sec { display: flex; flex-direction: column; gap: 10px; }
  .m-sec[hidden] { display: none; }
  .m-sec-title { font-size: 10px; letter-spacing: 0.25em; color: rgba(255,255,255,0.3); text-transform: uppercase; }
  .fld { display: flex; flex-direction: column; gap: 4px; }
  .fld label { font-size: 10px; letter-spacing: 0.18em; color: rgba(255,255,255,0.35); text-transform: uppercase; }
  .fld.lead input { font-size: 15px; border-color: rgba(200,166,60,0.45); color: #fff; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .param { display: grid; grid-template-columns: 1fr auto; gap: 4px; align-items: end; }
  .param .x { background: none; border: none; color: rgba(255,255,255,0.35); cursor: pointer; font-size: 15px; padding: 6px; }
  .param .x:hover { color: #e57373; }
  #np { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 6px; }
  #np[hidden] { display: none; }
  .link-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #m-link { font-size: 12px; color: var(--aight-yellow); word-break: break-all; flex: 1; min-width: 140px; }
  #m-link-input { flex: 1; min-width: 140px; }
  #m-link-input[hidden] { display: none; }
  #m-save-st { font-size: 10px; letter-spacing: 0.12em; color: rgba(255,255,255,0.3); }
  #m-save-st.err { color: #e57373; }
  #m-arch-st { font-size: 11px; color: rgba(255,255,255,0.35); }


  /* ── Category tree (sidebar filter + modal sort) ─────────────── */
  .s-row .lbl { display: flex; gap: 8px; align-items: center; }
  .s-row .box { width: 11px; height: 11px; border: 1px solid rgba(255,255,255,0.35); border-radius: 2px; flex: 0 0 11px; }
  .s-row.sel .box { background: var(--aight-yellow); border-color: var(--aight-yellow); }
  .tree { display: flex; flex-direction: column; }
  .t-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; color: rgba(255,255,255,0.75); }
  .t-row label { display: flex; align-items: center; gap: 8px; cursor: pointer; flex: 1; }
  .t-row input[type=checkbox] { width: auto; accent-color: var(--aight-yellow); }
  .t-row .plus { background: none; border: none; color: rgba(200,166,60,0.7); cursor: pointer; font-size: 14px; padding: 0 6px; }
  .t-row .plus:hover { color: var(--aight-yellow); }
  .t-add { display: flex; gap: 6px; padding: 4px 0 6px; }
  .empty-note { font-size: 12px; color: rgba(255,255,255,0.3); }

  /* ── {+ file} chooser + library picker ───────────────────────── */
  #add-choice { display: flex; gap: 6px; }
  #add-choice[hidden] { display: none; }
  #picker {
    position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.92);
    display: none; flex-direction: column; padding: 20px;
  }
  #picker.open { display: flex; }
  .pk-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .pk-title { font-size: 11px; letter-spacing: 0.3em; color: rgba(255,255,255,0.4); margin-right: auto; }
  .pk-note { font-size: 11px; color: rgba(255,255,255,0.35); }
  #pk-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; align-content: start; }
  #pk-grid .tile.picked { border-color: var(--aight-yellow); box-shadow: 0 0 0 1px var(--aight-yellow); }
  #pk-search { max-width: 260px; }
  @media (max-width: 820px) {
    #app { padding: 16px 16px 60px; }
    #modal { padding: 0; }
    .m-inner { height: 100vh; border-radius: 0; grid-template-columns: 1fr; grid-template-rows: 42vh 1fr; }
    .m-right { border-left: none; border-top: 1px solid #1a1a1a; }
  }
</style>
</head>
<body>

<div id="gate">
  <div id="gate-title">SWILL / back</div>
  <div id="gate-row">
    <input id="gate-input" type="password" placeholder="admin key" autocomplete="off">
    <button class="aight-btn" id="gate-enter">enter</button>
  </div>
  <div id="gate-err"></div>
</div>

<div id="app">
  <header>
    <button class="aight-btn" id="btn-sort">Sort</button>
    <div class="brand">SWILL <b>/ back</b></div>
    <span id="status"></span>
    <button class="aight-btn" id="btn-unpub">unpublished</button>
    <button class="aight-btn" id="btn-arch">archived</button>
    <button class="aight-btn" id="btn-csv">csv</button>
    <button class="aight-btn" id="btn-front">front</button>
    <button class="aight-btn" id="btn-logout">logout</button>
  </header>

  <div id="drop-zone">
    <button class="aight-btn important" id="btn-upload">upload</button>
    <p>or drop files here</p>
    <input type="file" id="file-input" multiple>
    <input type="file" id="add-file-input" multiple>
  </div>
  <div id="queue"></div>

  <div id="import-row">
    <span id="import-msg">The 67-work staging collection is still in the shared bucket.</span>
    <button class="aight-btn" id="btn-import">import</button>
  </div>

  <div class="grid-head">
    <span class="grid-title" id="grid-title">WORKS</span>
    <span id="grid-filter"></span>
    <span id="grid-count"></span>
  </div>
  <div id="grid"></div>
</div>

<!-- Sort sidebar: multi-select category filter. Click outside closes and keeps selections. -->
<div id="side">
  <div class="side-inner">
    <div class="side-head">
      <span class="side-title">SORT</span>
    </div>
    <div id="side-list"></div>
    <div class="side-add">
      <input id="side-new" placeholder="new category">
      <button class="aight-btn" id="side-add">+</button>
    </div>
  </div>
</div>

<!-- Work modal -->
<div id="modal">
  <div class="m-inner">
    <div class="m-left">
      <div id="m-preview"></div>
      <div id="m-files"></div>
    </div>
    <div class="m-right">
      <div class="m-top">
        <button class="aight-btn important" id="m-state">publish</button>
        <span id="m-save-st"></span>
        <span class="spacer"></span>
        <button class="aight-btn" id="m-prev">&nbsp;←&nbsp;</button>
        <button class="aight-btn" id="m-next">&nbsp;→&nbsp;</button>
        <button class="aight-btn" id="m-close">&nbsp;×&nbsp;</button>
      </div>
      <div class="m-tools">
        <button class="aight-btn active" id="t-annotate">Annotate</button>
        <button class="aight-btn" id="t-sort">sort</button>
        <button class="aight-btn" id="t-archive">Archive</button>
        <button class="aight-btn" id="t-add">+ file</button>
        <button class="aight-btn" id="t-dl">&nbsp;dl&nbsp;</button>
        <button class="aight-btn" id="t-delete">delete</button>
      </div>
      <div class="m-body">

        <div id="add-choice" hidden>
          <button class="aight-btn" id="add-lib">from library</button>
          <button class="aight-btn" id="add-up">upload</button>
        </div>

        <div class="m-sec">
          <div class="m-sec-title">link</div>
          <div class="link-row">
            <span id="m-link"></span>
            <input id="m-link-input" hidden spellcheck="false" autocomplete="off">
            <button class="aight-btn small" id="m-link-copy">copy</button>
            <button class="aight-btn small" id="m-link-ext">copy .ext</button>
            <button class="aight-btn small" id="m-link-edit">rename</button>
          </div>
        </div>

        <div class="m-sec" id="sec-sort" hidden>
          <div class="m-sec-title">sort</div>
          <div class="tree" id="s-tree"></div>
          <div class="t-add">
            <input id="s-new" placeholder="new category (paintings, video, song…)">
            <button class="aight-btn small" id="s-new-ok">+</button>
          </div>
        </div>

        <div class="m-sec" id="sec-annotate">
          <div class="m-sec-title">annotate</div>
          <div class="fld lead"><label>media type</label><input id="a-mediaType" list="dl-media" data-f="mediaType"></div>
          <div class="row2">
            <div class="fld"><label>title</label><input id="a-title" data-f="title"></div>
            <div class="fld"><label>serial</label><input id="a-serial" data-f="serial"></div>
          </div>
          <div class="row2">
            <div class="fld"><label>size / duration</label><input id="a-size" data-f="size"></div>
            <div class="fld"><label>materials</label><input id="a-materials" data-f="materials"></div>
          </div>
          <div id="a-params"></div>
          <div id="np" hidden>
            <input id="np-name" placeholder="parameter" list="dl-params">
            <input id="np-value" placeholder="value">
            <button class="aight-btn small" id="np-ok">add</button>
          </div>
          <div><button class="aight-btn small" id="a-param-plus">+ parameter</button></div>
          <div class="fld"><label>published notes</label><textarea id="a-notes" rows="5" data-f="notes"></textarea></div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Library picker for {+ file} → from library -->
<div id="picker">
  <div class="pk-head">
    <span class="pk-title">ADD FROM LIBRARY</span>
    <span class="pk-note">files move into this work — the works they came from are removed</span>
    <input id="pk-search" placeholder="filter">
    <button class="aight-btn important" id="pk-ok" disabled>move here</button>
    <button class="aight-btn" id="pk-close">&nbsp;×&nbsp;</button>
  </div>
  <div id="pk-grid"></div>
</div>

<datalist id="dl-media"></datalist>
<datalist id="dl-params"></datalist>

<script>
(function () {
  const API = '/api/swill';
  const LS = 'swill_admin';
  const MULTIPART_THRESHOLD = 80 * 1024 * 1024;
  const CHUNK = 50 * 1024 * 1024;
  const CONCURRENCY = 2;
  const HEIC2ANY = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  let secret = localStorage.getItem(LS) || '';
  let cat = null;                 // full catalog from server
  let view = [];                  // ids currently in the grid
  let sel = new Set();            // selected category ids in the sidebar ('none' = uncategorized)
  let mode = 'all';               // 'all' (published + unpublished) | 'unpublished' | 'archived'
  let openId = null;              // work open in modal
  let curFile = 0;                // index of previewed file in modal
  let addTarget = null;           // work id receiving uploaded files
  let picked = new Set();         // works picked in the library picker

  // ── API helpers ────────────────────────────────────────────

  function api(op, opts = {}) {
    return fetch(API + '?op=' + op + (opts.qs || ''), {
      method: opts.method || 'GET',
      headers: { 'x-swill-admin': secret, ...(opts.json ? { 'Content-Type': 'application/json' } : {}), ...(opts.headers || {}) },
      body: opts.json ? JSON.stringify(opts.json) : opts.body,
    }).then(res => {
      if (res.status === 401) { logout(); throw new Error('unauthorized'); }
      return res;
    });
  }
  async function apiJson(op, opts) {
    const res = await api(op, opts);
    if (!res.ok) throw new Error((await res.text()) || ('failed ' + res.status));
    return res.json();
  }
  const fileUrl = (k, dl) => API + '?op=file&k=' + encodeURIComponent(k) + '&a=' + encodeURIComponent(secret) + (dl ? '&dl=1' : '');
  const setStatus = msg => { $('status').textContent = msg || ''; };

  // ── Gate ───────────────────────────────────────────────────

  async function unlock(k) {
    const res = await fetch(API + '?op=admin-verify', { headers: { 'x-swill-admin': k } });
    if (!res.ok) return false;
    secret = k;
    localStorage.setItem(LS, k);
    $('gate').classList.add('hidden');
    $('app').classList.add('visible');
    await load();
    return true;
  }
  function logout() {
    localStorage.removeItem(LS);
    secret = '';
    $('app').classList.remove('visible');
    if (openId) closeModal();
    $('gate').classList.remove('hidden');
  }
  async function enter() {
    const k = $('gate-input').value.trim();
    if (!k) return;
    $('gate-err').textContent = '';
    if (!(await unlock(k))) $('gate-err').textContent = 'INVALID KEY';
  }
  $('gate-enter').addEventListener('click', enter);
  $('gate-input').addEventListener('keydown', e => { if (e.key === 'Enter') enter(); });
  $('btn-logout').addEventListener('click', logout);
  $('btn-front').addEventListener('click', () => window.open(mode === 'archived' ? '/swill/archive' : '/swill', '_blank'));
  $('btn-csv').addEventListener('click', async () => {
    const res = await api('csv');
    if (!res.ok) { setStatus(await res.text()); return; }
    const url = URL.createObjectURL(await res.blob());
    const a = document.createElement('a');
    a.href = url; a.download = 'swill-master.csv'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  });

  // ── Load + grid ────────────────────────────────────────────

  async function load() {
    setStatus('loading…');
    cat = await apiJson('catalog');
    $('import-row').classList.toggle('show', !!cat.legacyAvailable);
    refreshLists();
    renderGrid();
    setStatus('');
    backfillThumbs();
  }

  function refreshLists() {
    const media = [...new Set(Object.values(cat.works).map(w => w.mediaType).filter(Boolean))].sort();
    $('dl-media').innerHTML = media.map(m => '<option value="' + esc(m) + '">').join('');
    $('dl-params').innerHTML = cat.params.map(p => '<option value="' + esc(p) + '">').join('');
  }

  // Category helpers — flat list of { id, name, parent }, any depth.
  const childrenOf = pid => cat.categories.filter(c => (c.parent || '') === pid).sort((a, b) => a.name.localeCompare(b.name));
  function withDescendants(ids) {
    const out = new Set(ids);
    let grew = true;
    while (grew) {
      grew = false;
      cat.categories.forEach(c => { if (c.parent && out.has(c.parent) && !out.has(c.id)) { out.add(c.id); grew = true; } });
    }
    return out;
  }
  function walk(fn, pid = '', depth = 0) {
    childrenOf(pid).forEach(c => { fn(c, depth); walk(fn, c.id, depth + 1); });
  }
  const catName = id => (cat.categories.find(c => c.id === id) || {}).name || '';

  function inMode(w) {
    if (mode === 'archived') return w.state === 'archived';
    if (mode === 'unpublished') return w.state === 'unpublished';
    return w.state !== 'archived';
  }
  function matchesSort(w) {
    if (!sel.size) return true;
    if (sel.has('none') && !w.cats.length) return true;
    const want = withDescendants([...sel].filter(x => x !== 'none'));
    return w.cats.some(id => want.has(id));
  }

  function kindLabel(w) {
    const f = w.files[0];
    if (!f) return '';
    return f.kind === 'doc' ? (f.name.split('.').pop() || 'file') : f.kind;
  }

  function tileHtml(w) {
    const f = w.files[0];
    const thumb = f && (f.thumb || f.web);
    const kind = kindLabel(w);
    return '<div class="tile" data-id="' + w.id + '">' +
      '<div class="thumb">' + (thumb ? '<img loading="lazy" src="' + esc(fileUrl(thumb)) + '" alt="">' : '<span class="ext">' + esc(kind || '—') + '</span>') + '</div>' +
      (kind && kind !== 'image' ? '<span class="badge">' + esc(kind) + '</span>' : '') +
      (w.state === 'published' ? '<span class="dot" title="published"></span>' : '') +
      '<div class="meta"><span class="t1">' + esc(w.title || (f ? f.name : 'untitled')) + '</span>' +
      '<span class="t2">' + esc([w.serial, w.cats.map(catName).filter(Boolean).join(', '), w.files.length > 1 ? w.files.length + ' files' : ''].filter(Boolean).join(' · ')) + '</span></div>' +
      '</div>';
  }

  function renderGrid() {
    view = cat.order.filter(id => cat.works[id] && inMode(cat.works[id]) && matchesSort(cat.works[id]));
    $('grid-title').textContent = mode === 'archived' ? 'ARCHIVED' : mode === 'unpublished' ? 'UNPUBLISHED' : 'WORKS';
    $('grid-filter').textContent = [...sel].map(id => id === 'none' ? 'uncategorized' : catName(id)).join(', ');
    $('grid-count').textContent = String(view.length);
    $('btn-unpub').classList.toggle('active', mode === 'unpublished');
    $('btn-arch').classList.toggle('active', mode === 'archived');
    $('btn-sort').classList.toggle('active', sel.size > 0);
    $('grid').innerHTML = view.length ? view.map(id => tileHtml(cat.works[id])).join('')
      : '<div class="empty">' + (cat.order.length ? 'nothing here' : 'no works yet — upload to begin') + '</div>';
  }

  $('grid').addEventListener('click', e => {
    const t = e.target.closest('.tile');
    if (t) openModal(t.dataset.id);
  });
  $('btn-unpub').addEventListener('click', () => { mode = mode === 'unpublished' ? 'all' : 'unpublished'; renderGrid(); });
  $('btn-arch').addEventListener('click', () => { mode = mode === 'archived' ? 'all' : 'archived'; renderGrid(); });

  // ── Legacy import (staging set → swill bucket), then purge ─

  $('btn-import').addEventListener('click', async () => {
    $('btn-import').disabled = true;
    try {
      let start = 0, total = 0, imported = 0;
      while (start != null) {
        const r = await apiJson('import-legacy', { method: 'POST', qs: '&start=' + start });
        imported += r.imported;
        total = r.total;
        start = r.next;
        $('import-msg').textContent = 'importing… ' + (start == null ? total : start) + ' / ' + total;
      }
      $('import-msg').textContent = 'imported ' + imported + ' — removing the old copy from the shared bucket…';
      const p = await apiJson('purge-legacy', { method: 'POST' });
      $('import-msg').textContent = 'done — ' + imported + ' works imported, ' + p.deleted + ' old objects removed';
      $('btn-import').hidden = true;
      await load();
      $('import-row').classList.add('show');
    } catch (e) {
      $('import-msg').textContent = 'stopped: ' + e.message + ' (press import again to resume — nothing is duplicated)';
      $('btn-import').disabled = false;
    }
  });

  // Imported staging images have no grid thumbnail yet; make them here, one
  // at a time, in the background.
  let backfilling = false;
  async function backfillThumbs() {
    if (backfilling) return;
    backfilling = true;
    try {
      for (const w of Object.values(cat.works)) {
        let changed = false;
        for (const f of w.files) {
          if (f.kind !== 'image' || f.thumb || !f.web || !secret) continue;
          try {
            const blob = await (await fetch(fileUrl(f.web))).blob();
            const bmp = await createImageBitmap(blob);
            const thumb = await canvasJpeg(bmp, bmp.width, bmp.height, 480, 0.75);
            const k = 'files/' + f.id + '/thumb.jpg';
            await putObject(k, thumb, 'image/jpeg');
            f.thumb = k;
            if (!f.w) { f.w = bmp.width; f.h = bmp.height; }
            changed = true;
          } catch (e) { /* leave it; the grid falls back to web.jpg */ }
        }
        if (changed) await saveWork(w).catch(() => {});
      }
    } finally { backfilling = false; }
  }

  // ── Sort sidebar (filter) ──────────────────────────────────

  function countIn(id) {
    const ids = withDescendants([id]);
    return Object.values(cat.works).filter(w => inMode(w) && w.cats.some(c => ids.has(c))).length;
  }

  function renderSide() {
    const rows = ['<div class="s-row ' + (!sel.size ? 'sel' : '') + '" data-a="all"><span class="lbl">all</span></div>'];
    walk((c, depth) => {
      rows.push('<div class="s-row ' + (sel.has(c.id) ? 'sel' : '') + '" data-id="' + c.id + '" style="padding-left:' + (4 + depth * 16) + 'px">' +
        '<span class="lbl"><span class="box"></span>' + esc(c.name) + '</span><span class="n">' + countIn(c.id) + '</span></div>');
    });
    const none = Object.values(cat.works).filter(w => inMode(w) && !w.cats.length).length;
    if (none) rows.push('<div class="s-row muted ' + (sel.has('none') ? 'sel' : '') + '" data-id="none"><span class="lbl"><span class="box"></span>uncategorized</span><span class="n">' + none + '</span></div>');
    $('side-list').innerHTML = rows.join('');
  }

  $('side-list').addEventListener('click', e => {
    const r = e.target.closest('.s-row');
    if (!r) return;
    if (r.dataset.a === 'all') sel.clear();
    else if (sel.has(r.dataset.id)) sel.delete(r.dataset.id);
    else sel.add(r.dataset.id);
    renderSide();
    renderGrid();
  });
  $('btn-sort').addEventListener('click', () => { renderSide(); $('side').classList.add('open'); });
  $('side').addEventListener('click', e => { if (e.target === $('side')) $('side').classList.remove('open'); });

  async function saveMeta() {
    const r = await apiJson('meta', { method: 'POST', json: { categories: cat.categories, params: cat.params } });
    cat.categories = r.categories;
    cat.params = r.params;
    refreshLists();
  }
  const newCatId = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), b => 'abcdefghijklmnopqrstuvwxyz0123456789'[b % 36]).join('');
  function addCategory(name, parent) {
    name = name.trim();
    if (!name) return null;
    const existing = cat.categories.find(c => (c.parent || '') === (parent || '') && c.name.toLowerCase() === name.toLowerCase());
    if (existing) return existing.id;
    const c = { id: newCatId(), name, parent: parent || '' };
    cat.categories.push(c);
    return c.id;
  }
  $('side-add').addEventListener('click', async () => {
    if (!addCategory($('side-new').value, '')) return;
    $('side-new').value = '';
    renderSide();
    await saveMeta().catch(e => setStatus(e.message));
  });
  $('side-new').addEventListener('keydown', e => { if (e.key === 'Enter') $('side-add').click(); });

  // ── Upload ─────────────────────────────────────────────────

  const randId = newCatId;
  const safeName = n => (n.replace(/[^A-Za-z0-9._-]/g, '_').replace(/^\.+/, '') || 'file').slice(-180);
  const EXT_KIND = {
    image: /\.(jpe?g|png|gif|webp|heic|heif|avif|bmp|tiff?|svg)$/i,
    video: /\.(mp4|mov|m4v|webm|mkv|avi|3gp|wmv|mts|m2ts)$/i,
    audio: /\.(mp3|wav|aiff?|flac|m4a|aac|ogg|opus)$/i,
  };
  function kindOf(file) {
    const t = file.type || '';
    if (t.startsWith('image/') || EXT_KIND.image.test(file.name)) return 'image';
    if (t.startsWith('video/') || EXT_KIND.video.test(file.name)) return 'video';
    if (t.startsWith('audio/') || EXT_KIND.audio.test(file.name)) return 'audio';
    return 'doc';
  }
  function fmtDur(s) {
    if (!s || !isFinite(s)) return '';
    s = Math.round(s);
    const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = String(s % 60).padStart(2, '0');
    return h ? h + ':' + String(m).padStart(2, '0') + ':' + ss : m + ':' + ss;
  }

  function canvasJpeg(src, sw, sh, max, q) {
    const scale = Math.min(1, max / Math.max(sw, sh));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(sw * scale));
    c.height = Math.max(1, Math.round(sh * scale));
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(src, 0, 0, c.width, c.height);
    return new Promise(r => c.toBlob(r, 'image/jpeg', q));
  }

  function mediaMeta(file, tag) {
    return new Promise(resolve => {
      const el = document.createElement(tag);
      const url = URL.createObjectURL(file);
      let done = false;
      const finish = v => { if (done) return; done = true; URL.revokeObjectURL(url); resolve(v); };
      setTimeout(() => finish(null), 10000);
      el.preload = 'auto';
      el.muted = true;
      el.playsInline = true;
      el.onerror = () => finish(null);
      el.onloadedmetadata = () => {
        if (tag === 'audio') return finish({ el, dur: el.duration });
        el.currentTime = Math.min(1, (el.duration || 0) / 3);
      };
      el.onseeked = () => finish({ el, dur: el.duration });
      el.src = url;
    });
  }

  let heicLib = null;
  function loadHeic() {
    heicLib = heicLib || new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = HEIC2ANY;
      s.onload = () => resolve(window.heic2any);
      s.onerror = () => { heicLib = null; reject(new Error('heic converter failed to load')); };
      document.head.appendChild(s);
    });
    return heicLib;
  }
  async function decodeImage(file) {
    try { return await createImageBitmap(file); }
    catch (e) {
      // Chrome/Firefox can't decode iPhone HEIC — convert to JPEG first.
      if (!/\.(heic|heif)$/i.test(file.name) && !/hei[cf]/.test(file.type)) throw e;
      const heic2any = await loadHeic();
      const out = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.92 });
      return createImageBitmap(Array.isArray(out) ? out[0] : out);
    }
  }

  // Display + thumbnail derivatives are made in the browser so the server
  // stays a plain store. Anything undecodable just shows as a file card.
  async function derivatives(file, kind) {
    const out = { web: null, thumb: null, w: 0, h: 0, dur: 0, keepOriginalAsWeb: false };
    try {
      if (kind === 'image') {
        out.keepOriginalAsWeb = /image\/(gif|svg)/.test(file.type);
        const bmp = await decodeImage(file);
        out.w = bmp.width; out.h = bmp.height;
        if (!out.keepOriginalAsWeb) out.web = await canvasJpeg(bmp, bmp.width, bmp.height, 1600, 0.82);
        out.thumb = await canvasJpeg(bmp, bmp.width, bmp.height, 480, 0.75);
        if (bmp.close) bmp.close();
      } else if (kind === 'video') {
        const m = await mediaMeta(file, 'video');
        if (m) {
          out.dur = m.dur || 0;
          out.w = m.el.videoWidth; out.h = m.el.videoHeight;
          if (out.w) {
            out.web = await canvasJpeg(m.el, out.w, out.h, 1600, 0.82);
            out.thumb = await canvasJpeg(m.el, out.w, out.h, 480, 0.75);
          }
        }
      } else if (kind === 'audio') {
        const m = await mediaMeta(file, 'audio');
        if (m) out.dur = m.dur || 0;
      }
    } catch (e) { /* undecodable — no derivatives */ }
    return out;
  }

  function xhrPut(url, body, type, onProgress) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('PUT', url);
      xhr.setRequestHeader('x-swill-admin', secret);
      if (type) xhr.setRequestHeader('x-file-type', type);
      xhr.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(e.loaded); };
      xhr.onload = () => {
        if (xhr.status === 401) { logout(); return reject(new Error('unauthorized')); }
        if (xhr.status >= 200 && xhr.status < 300) {
          try { resolve(JSON.parse(xhr.responseText)); } catch (e) { resolve({}); }
        } else reject(new Error('failed ' + xhr.status));
      };
      xhr.onerror = () => reject(new Error('network error'));
      xhr.send(body);
    });
  }

  // < 80 MB goes in one request; larger files use R2 multipart (50 MB parts,
  // 3 tries each) to stay under Cloudflare's 100 MB request limit.
  async function putObject(k, blob, type, onProgress) {
    const qs = '&k=' + encodeURIComponent(k);
    if (blob.size < MULTIPART_THRESHOLD) return xhrPut(API + '?op=put' + qs, blob, type, onProgress);
    const init = await apiJson('mpu-init', { method: 'POST', qs, headers: { 'x-file-type': type } });
    const uq = qs + '&u=' + encodeURIComponent(init.uploadId);
    const parts = [];
    const total = Math.ceil(blob.size / CHUNK);
    for (let n = 1; n <= total; n++) {
      const start = (n - 1) * CHUNK;
      const chunk = blob.slice(start, Math.min(start + CHUNK, blob.size));
      let lastErr = null;
      for (let attempt = 1; attempt <= 3; attempt++) {
        try {
          parts.push(await xhrPut(API + '?op=mpu-part' + uq + '&n=' + n, chunk, '', b => onProgress && onProgress(start + b)));
          lastErr = null;
          break;
        } catch (e) { lastErr = e; await new Promise(r => setTimeout(r, 1000 * attempt)); }
      }
      if (lastErr) throw lastErr;
    }
    await apiJson('mpu-done', { method: 'POST', qs: uq, json: { parts } });
  }

  // Uploads one file and returns its file record (not yet attached to a work).
  async function uploadFile(file, onProgress) {
    const fid = randId();
    const kind = kindOf(file);
    const type = file.type || (/\.(heic|heif)$/i.test(file.name) ? 'image/heic' : 'application/octet-stream');
    const base = 'files/' + fid + '/';
    const k = base + 'o_' + safeName(file.name);
    const d = await derivatives(file, kind);

    await putObject(k, file, type, onProgress);
    const rec = { id: fid, k, web: '', thumb: '', name: file.name, type, kind, bytes: file.size, w: d.w, h: d.h, dur: d.dur };
    if (d.keepOriginalAsWeb) rec.web = k;
    if (d.web) { await putObject(base + 'web.jpg', d.web, 'image/jpeg'); rec.web = base + 'web.jpg'; }
    if (d.thumb) { await putObject(base + 'thumb.jpg', d.thumb, 'image/jpeg'); rec.thumb = base + 'thumb.jpg'; }
    return rec;
  }

  function queueRow(file) {
    const el = document.createElement('div');
    el.className = 'q-item';
    el.innerHTML = '<div class="q-top"><span class="q-name"></span><span class="q-st">waiting</span></div><div class="q-bar-wrap"><div class="q-bar"></div></div>';
    el.querySelector('.q-name').textContent = file.name;
    $('queue').prepend(el);
    return {
      progress: b => {
        const pct = Math.round(b / Math.max(1, file.size) * 100) + '%';
        el.querySelector('.q-bar').style.width = pct;
        el.querySelector('.q-st').textContent = pct;
      },
      state: (txt, cls) => { const st = el.querySelector('.q-st'); st.textContent = txt; st.className = 'q-st ' + (cls || ''); },
      done: () => { const st = el.querySelector('.q-st'); st.textContent = 'done'; st.className = 'q-st done'; setTimeout(() => el.remove(), 2500); },
    };
  }

  async function runPool(items, worker) {
    let i = 0;
    const next = async () => { while (i < items.length) { const it = items[i++]; await worker(it); } };
    await Promise.all(Array.from({ length: Math.min(CONCURRENCY, items.length) }, next));
  }

  // New uploads: one work per file. When the batch finishes the modal opens
  // on the newest; ←/→ steps through the rest.
  async function uploadNew(files) {
    if (!files.length) return;
    const created = [];
    await runPool(files, async file => {
      const row = queueRow(file);
      try {
        row.state('preparing');
        const rec = await uploadFile(file, b => row.progress(b));
        row.state('saving');
        const work = await apiJson('work', { method: 'POST', json: { work: {
          id: randId(), state: 'unpublished', title: file.name.replace(/\.[^.]+$/, ''),
          size: fmtDur(rec.dur), files: [rec], cats: [], params: [],
        } } });
        cat.works[work.id] = work;
        cat.order.unshift(work.id);
        created.push(work.id);
        row.done();
      } catch (e) { row.state(e.message, 'error'); }
    });
    if (!created.length) return;
    if (mode === 'archived') mode = 'all';
    sel.clear();
    renderGrid();
    if (!openId) openModal(view.find(id => created.includes(id)));
  }

  // {+ file} → upload: attach new files to an existing work.
  async function uploadInto(id, files) {
    for (const file of files) {
      const row = queueRow(file);
      try {
        row.state('preparing');
        const rec = await uploadFile(file, b => row.progress(b));
        const w = cat.works[id];
        if (!w) throw new Error('work was deleted');
        w.files.push(rec);
        await saveWork(w);
        row.done();
        if (openId === id) { curFile = w.files.length - 1; renderModal(); }
      } catch (e) { row.state(e.message, 'error'); }
    }
    renderGrid();
  }

  $('btn-upload').addEventListener('click', () => $('file-input').click());
  $('file-input').addEventListener('change', function () { uploadNew(Array.from(this.files)); this.value = ''; });
  $('add-file-input').addEventListener('change', function () { if (addTarget) uploadInto(addTarget, Array.from(this.files)); this.value = ''; });
  const dz = $('drop-zone');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', e => {
    e.preventDefault();
    dz.classList.remove('drag-over');
    uploadNew(Array.from(e.dataTransfer.files).filter(f => f.size || f.type));
  });

  // ── Saving ─────────────────────────────────────────────────

  let saveTimer = null;
  let saving = Promise.resolve();

  function saveSt(txt, err) { $('m-save-st').textContent = txt; $('m-save-st').className = err ? 'err' : ''; }

  // Saves are queued so they land in order. Only server-owned fields are
  // copied back, so edits typed while a save is in flight are never lost.
  function saveWork(w) {
    saving = saving.catch(() => {}).then(async () => {
      if (openId === w.id) saveSt('saving…');
      try {
        const saved = await apiJson('work', { method: 'POST', json: { work: w } });
        const local = cat.works[saved.id];
        if (local) {
          local.created = saved.created;
          local.updated = saved.updated;
          saved.files.forEach(sf => { const lf = local.files.find(f => f.id === sf.id); if (lf && !lf.slug) lf.slug = sf.slug; });
        }
        if (openId === w.id) { saveSt('saved'); renderLink(); }
      } catch (e) {
        if (openId === w.id) saveSt(e.message, true);
        throw e;
      }
    });
    return saving;
  }
  function saveSoon() {
    clearTimeout(saveTimer);
    saveSt('…');
    saveTimer = setTimeout(() => { saveTimer = null; if (openId) saveWork(cat.works[openId]).catch(() => {}); renderGrid(); }, 700);
  }
  function flushSave() {
    if (!saveTimer) return;
    clearTimeout(saveTimer);
    saveTimer = null;
    if (openId && cat.works[openId]) saveWork(cat.works[openId]).catch(() => {});
  }

  // ── Modal ──────────────────────────────────────────────────

  function openModal(id) {
    if (!id || !cat.works[id]) return;
    flushSave();
    openId = id;
    curFile = 0;
    $('m-link-input').hidden = true;
    $('m-link').hidden = false;
    $('m-link-edit').textContent = 'rename';
    $('np').hidden = true;
    $('add-choice').hidden = true;
    renderModal();
    $('modal').classList.add('open');
  }
  function closeModal() {
    flushSave();
    $('modal').classList.remove('open');
    $('m-preview').innerHTML = '';
    openId = null;
    if (cat) renderGrid();
  }

  function renderPreview(w) {
    const f = w.files[curFile];
    const p = $('m-preview');
    if (!f) { p.innerHTML = '<div class="doc-card">no file</div>'; return; }
    if (f.kind === 'image' && f.web) p.innerHTML = '<img src="' + esc(fileUrl(f.web)) + '" alt="">';
    else if (f.kind === 'video') p.innerHTML = '<video controls playsinline preload="metadata" ' + (f.web ? 'poster="' + esc(fileUrl(f.web)) + '"' : '') + ' src="' + esc(fileUrl(f.k)) + '"></video>';
    else if (f.kind === 'audio') p.innerHTML = '<audio controls preload="metadata" src="' + esc(fileUrl(f.k)) + '"></audio>';
    else p.innerHTML = '<div class="doc-card"><span class="ext">' + esc((f.name.split('.').pop() || 'file').toUpperCase()) + '</span><span>' + esc(f.name) + '</span>' +
      '<a class="aight-btn" target="_blank" rel="noopener" href="' + esc(fileUrl(f.k)) + '">open</a></div>';
  }

  function renderFiles(w) {
    $('m-files').innerHTML = w.files.map((f, i) => {
      const t = f.thumb || f.web;
      return '<div class="m-file ' + (i === curFile ? 'cur' : '') + '" data-i="' + i + '" title="' + esc(f.name) + '">' +
        (t ? '<img src="' + esc(fileUrl(t)) + '" alt="">' : esc((f.name.split('.').pop() || f.kind).slice(0, 5))) +
        '<span class="x" data-x="' + i + '">×</span></div>';
    }).join('') + (curFile > 0 ? '<button class="aight-btn small" id="m-cover">cover</button>' : '');
  }

  function linkFor(f) { return location.origin + '/swill/f/' + f.slug; }
  function renderLink() {
    const w = cat.works[openId];
    const f = w && w.files[curFile];
    $('m-link').textContent = f && f.slug ? linkFor(f) : (f ? 'saving…' : '');
  }

  function renderTree(w) {
    const rows = [];
    walk((c, depth) => {
      rows.push('<div class="t-row" style="padding-left:' + depth * 18 + 'px">' +
        '<label><input type="checkbox" data-c="' + c.id + '"' + (w.cats.includes(c.id) ? ' checked' : '') + '>' + esc(c.name) + '</label>' +
        '<button class="plus" data-sub="' + c.id + '" title="add inside ' + esc(c.name) + '">+</button></div>' +
        '<div class="t-add" data-for="' + c.id + '" hidden style="padding-left:' + (depth + 1) * 18 + 'px">' +
        '<input placeholder="inside ' + esc(c.name) + '"><button class="aight-btn small" data-ok="' + c.id + '">+</button></div>');
    });
    $('s-tree').innerHTML = rows.length ? rows.join('') : '<div class="empty-note">no categories yet — create one below</div>';
  }

  function renderParams(w) {
    $('a-params').innerHTML = w.params.map((p, i) =>
      '<div class="param"><div class="fld"><label>' + esc(p.name) + '</label><input data-p="' + i + '" value="' + esc(p.value) + '"></div>' +
      '<button class="x" data-px="' + i + '" title="remove">×</button></div>').join('');
  }

  function renderModal() {
    const w = cat.works[openId];
    if (!w) return closeModal();
    const st = $('m-state');
    st.textContent = { unpublished: 'publish', published: 'unpublish', archived: 'unarchive' }[w.state];
    st.classList.toggle('important', w.state === 'unpublished');
    $('t-archive').hidden = w.state === 'archived';
    document.querySelectorAll('[data-f]').forEach(el => { el.value = w[el.dataset.f] || ''; });
    const idx = view.indexOf(openId);
    $('m-prev').disabled = idx <= 0;
    $('m-next').disabled = idx < 0 || idx >= view.length - 1;
    renderPreview(w);
    renderFiles(w);
    renderLink();
    renderTree(w);
    renderParams(w);
    saveSt('');
  }

  // Field edits autosave — no save button.
  document.querySelectorAll('[data-f]').forEach(el => {
    el.addEventListener('input', () => { cat.works[openId][el.dataset.f] = el.value; saveSoon(); });
  });
  $('a-params').addEventListener('input', e => {
    const i = e.target.dataset.p;
    if (i == null) return;
    cat.works[openId].params[i].value = e.target.value;
    saveSoon();
  });
  $('a-params').addEventListener('click', e => {
    const i = e.target.dataset.px;
    if (i == null) return;
    cat.works[openId].params.splice(+i, 1);
    renderParams(cat.works[openId]);
    saveSoon();
  });
  $('a-param-plus').addEventListener('click', () => { $('np').hidden = !$('np').hidden; if (!$('np').hidden) $('np-name').focus(); });
  function addParam() {
    const name = $('np-name').value.trim();
    if (!name) return;
    const w = cat.works[openId];
    const existing = w.params.find(p => p.name.toLowerCase() === name.toLowerCase());
    if (existing) existing.value = $('np-value').value;
    else w.params.push({ name, value: $('np-value').value });
    $('np-name').value = ''; $('np-value').value = '';
    $('np').hidden = true;
    renderParams(w);
    saveSoon();
    if (!cat.params.includes(name)) { cat.params.push(name); saveMeta().catch(() => {}); }
  }
  $('np-ok').addEventListener('click', addParam);
  $('np-value').addEventListener('keydown', e => { if (e.key === 'Enter') addParam(); });
  $('np-name').addEventListener('keydown', e => { if (e.key === 'Enter') $('np-value').focus(); });

  // Tool toggles
  function toggleSec(btn, sec) { $(sec).hidden = !$(sec).hidden; $(btn).classList.toggle('active', !$(sec).hidden); }
  $('t-annotate').addEventListener('click', () => toggleSec('t-annotate', 'sec-annotate'));
  $('t-sort').addEventListener('click', () => toggleSec('t-sort', 'sec-sort'));

  function setState(state) {
    const w = cat.works[openId];
    w.state = state;
    clearTimeout(saveTimer); saveTimer = null;
    saveWork(w).catch(() => {});
    renderModal();
    renderGrid();
  }
  $('m-state').addEventListener('click', () => {
    const w = cat.works[openId];
    setState(w.state === 'unpublished' ? 'published' : 'unpublished');
  });
  $('t-archive').addEventListener('click', () => setState('archived'));

  $('t-add').addEventListener('click', () => { $('add-choice').hidden = !$('add-choice').hidden; });
  $('add-up').addEventListener('click', () => { $('add-choice').hidden = true; addTarget = openId; $('add-file-input').click(); });
  $('add-lib').addEventListener('click', () => { $('add-choice').hidden = true; openPicker(); });

  $('t-dl').addEventListener('click', () => {
    const f = cat.works[openId].files[curFile];
    if (f) window.open(fileUrl(f.k, true), '_blank');
  });
  $('t-delete').addEventListener('click', async () => {
    const id = openId;
    const idx = view.indexOf(id);
    clearTimeout(saveTimer); saveTimer = null;
    try {
      await apiJson('delete', { method: 'POST', json: { id } });
      delete cat.works[id];
      cat.order = cat.order.filter(x => x !== id);
      openId = null;
      renderGrid();
      const nextId = view[Math.min(idx, view.length - 1)];
      if (nextId) openModal(nextId); else closeModal();
    } catch (e) { saveSt(e.message, true); }
  });

  $('m-files').addEventListener('click', e => {
    const w = cat.works[openId];
    if (e.target.id === 'm-cover') {
      const [f] = w.files.splice(curFile, 1);
      w.files.unshift(f);
      curFile = 0;
      renderModal(); renderGrid();
      saveSoon();
      return;
    }
    if (e.target.dataset.x != null) {
      w.files.splice(+e.target.dataset.x, 1);
      curFile = Math.min(curFile, Math.max(0, w.files.length - 1));
      renderModal(); renderGrid();
      saveSoon();
      return;
    }
    const tile = e.target.closest('.m-file');
    if (tile) {
      curFile = +tile.dataset.i;
      renderPreview(w); renderFiles(w); renderLink();
    }
  });

  // Sort section: tree of checkboxes, + adds a category inside any node.
  $('s-tree').addEventListener('change', e => {
    const id = e.target.dataset.c;
    if (!id) return;
    const w = cat.works[openId];
    w.cats = e.target.checked ? [...new Set([...w.cats, id])] : w.cats.filter(x => x !== id);
    saveSoon();
  });
  async function createAndCheck(name, parent) {
    const id = addCategory(name, parent);
    if (!id) return;
    const w = cat.works[openId];
    if (!w.cats.includes(id)) w.cats.push(id);
    renderTree(w);
    await saveMeta().catch(e => saveSt(e.message, true));
    saveSoon();
  }
  $('s-tree').addEventListener('click', e => {
    if (e.target.dataset.sub) {
      const box = $('s-tree').querySelector('.t-add[data-for="' + e.target.dataset.sub + '"]');
      box.hidden = !box.hidden;
      if (!box.hidden) box.querySelector('input').focus();
    }
    if (e.target.dataset.ok) {
      const input = e.target.previousElementSibling;
      createAndCheck(input.value, e.target.dataset.ok);
    }
  });
  $('s-tree').addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.target.tagName !== 'INPUT' || e.target.type === 'checkbox') return;
    createAndCheck(e.target.value, e.target.closest('.t-add').dataset.for);
  });
  $('s-new-ok').addEventListener('click', () => { createAndCheck($('s-new').value, ''); $('s-new').value = ''; });
  $('s-new').addEventListener('keydown', e => { if (e.key === 'Enter') $('s-new-ok').click(); });

  // Slug link for the previewed file.
  function copyText(text, btn, label) {
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = 'copied';
      setTimeout(() => { btn.textContent = label; }, 1200);
    }).catch(() => {});
  }
  $('m-link-copy').addEventListener('click', () => {
    const f = cat.works[openId].files[curFile];
    if (f && f.slug) copyText(linkFor(f), $('m-link-copy'), 'copy');
  });
  $('m-link-ext').addEventListener('click', () => {
    const f = cat.works[openId].files[curFile];
    if (!f || !f.slug) return;
    const ext = (f.k.split('.').pop() || '').toLowerCase();
    copyText(linkFor(f) + (ext && !f.k.endsWith('/' + ext) ? '.' + ext : ''), $('m-link-ext'), 'copy .ext');
  });
  $('m-link-edit').addEventListener('click', () => {
    const f = cat.works[openId].files[curFile];
    if (!f) return;
    if ($('m-link-input').hidden) {
      $('m-link-input').value = f.slug || '';
      $('m-link-input').hidden = false;
      $('m-link').hidden = true;
      $('m-link-edit').textContent = 'ok';
      $('m-link-input').focus();
      $('m-link-input').select();
    } else commitSlug();
  });
  function endSlugEdit() {
    $('m-link-input').hidden = true;
    $('m-link').hidden = false;
    $('m-link-edit').textContent = 'rename';
    renderLink();
  }
  async function commitSlug() {
    const w = cat.works[openId];
    const f = w.files[curFile];
    const val = $('m-link-input').value.trim().toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '');
    const prev = f.slug;
    if (val && val !== prev) {
      clearTimeout(saveTimer); saveTimer = null;
      f.slug = val;
      try { await saveWork(w); }
      catch (e) { f.slug = prev; return; }
    }
    endSlugEdit();
  }
  $('m-link-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') commitSlug();
    if (e.key === 'Escape') { e.stopPropagation(); endSlugEdit(); }
  });

  // ── Library picker ({+ file} → from library) ───────────────

  function renderPicker() {
    const q = $('pk-search').value.trim().toLowerCase();
    const ids = cat.order.filter(id => {
      const w = cat.works[id];
      if (!w || id === openId) return false;
      if (!q) return true;
      return [w.title, w.serial, w.mediaType, ...w.files.map(f => f.name)].join(' ').toLowerCase().includes(q);
    });
    $('pk-grid').innerHTML = ids.length ? ids.map(id => tileHtml(cat.works[id]).replace('class="tile"', 'class="tile' + (picked.has(id) ? ' picked' : '') + '"')).join('')
      : '<div class="empty">nothing to add</div>';
    $('pk-ok').disabled = !picked.size;
    $('pk-ok').textContent = picked.size ? 'move ' + picked.size + ' here' : 'move here';
  }
  function openPicker() { picked.clear(); $('pk-search').value = ''; renderPicker(); $('picker').classList.add('open'); }
  function closePicker() { $('picker').classList.remove('open'); }
  $('pk-grid').addEventListener('click', e => {
    const t = e.target.closest('.tile');
    if (!t) return;
    const id = t.dataset.id;
    if (picked.has(id)) picked.delete(id); else picked.add(id);
    renderPicker();
  });
  $('pk-search').addEventListener('input', renderPicker);
  $('pk-close').addEventListener('click', closePicker);
  $('pk-ok').addEventListener('click', async () => {
    const into = openId;
    flushSave();
    await saving.catch(() => {});
    $('pk-ok').disabled = true;
    try {
      const r = await apiJson('merge', { method: 'POST', json: { into, from: [...picked] } });
      r.removed.forEach(id => { delete cat.works[id]; });
      cat.order = cat.order.filter(id => cat.works[id]);
      cat.works[into].files = r.work.files;
      closePicker();
      renderGrid();
      renderModal();
    } catch (e) { $('pk-ok').disabled = false; $('pk-ok').textContent = e.message; }
  });

  // ── Nav ────────────────────────────────────────────────────

  function step(d) {
    const nextId = view[view.indexOf(openId) + d];
    if (nextId) openModal(nextId);
  }
  $('m-prev').addEventListener('click', () => step(-1));
  $('m-next').addEventListener('click', () => step(1));
  $('m-close').addEventListener('click', closeModal);
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
  document.addEventListener('keydown', e => {
    if ($('picker').classList.contains('open')) { if (e.key === 'Escape') closePicker(); return; }
    if (!$('modal').classList.contains('open')) return;
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (typing) return;
    if (e.key === 'Escape') closeModal();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
  window.addEventListener('beforeunload', flushSave);

  // ── Boot ───────────────────────────────────────────────────
  if (secret) unlock(secret).then(ok => { if (!ok) logout(); }).catch(() => logout());
  else $('gate-input').focus();
})();
</script>
</body>
</html>
